name: Docs

on:
  push:
    branches: ["main"]

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Documentation
        run: doxygen Doxyfile

      # IMAGE_PATH=docs makes Doxygen rewrite README images to architecture.svg etc.
      # Copy explicitly so Pages still works if a Doxygen version skips the copy.
      - name: Include architecture diagrams
        run: cp -v docs/*.svg docs/html/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
