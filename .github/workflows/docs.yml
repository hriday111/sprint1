name: Docs

on:
  push:
    branches: ["main"]

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Doxygen + Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Download PlantUML
        run: |
          curl -fsSL -o /tmp/plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar

      # Render from .puml into docs/ (no commit back to main — avoids racing local pushes)
      - name: Render PlantUML diagrams
        run: java -jar /tmp/plantuml.jar -tsvg docs/*.puml

      - name: Generate Documentation
        run: doxygen Doxyfile

      - name: Include architecture diagrams
        run: cp -v docs/*.svg docs/html/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
